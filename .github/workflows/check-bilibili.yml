name: 检查B站新视频

on:
  workflow_dispatch:
    inputs:
      only_latest:
        # ★ 2026-10-29（用户："需要再补李大霄的 5 个视频，今天只补了最新的"）：
        #   脚本里 `ONLY_LATEST = process.env.ONLY_LATEST !== '0'` **默认为 true**
        #   ⇒ 即使主 UP 的 `maxPerRun: 5`，也只取最新 1 条。
        #   补历史时填 0 ⇒ 走"按列表逐条"分支，主 UP 会一次补到 maxPerRun(5) 个。
        #   ⚠️ 去重靠 videos.json 里的 bvid，**重复触发不会重复推送**，
        #     但每次都会把最近 5 条重新转录一遍（慢 + 费 LLM 额度）⇒ 只在确实缺数据时用。
        description: '1=只处理最新一条；0=按列表补齐（主UP最多5个，可用来补历史）'
        required: false
        default: '1'
      run_mode:
        # ★ 2026-11-07：提示词/黑话词表改版后需要重跑历史数据。
        #   本地缺 LLM_API_KEY / BILI_COOKIE（且 Windows 上 yt-dlp 取不到浏览器 Cookie，
        #   DPAPI 解密失败），只有 Actions Secrets 里齐全 ⇒ 把重跑入口放到这里手动触发。
        #   推荐两步：先 archive-transcripts 抓 AI 字幕存档（秒级），
        #            再 reanalyze 复用原文做分析（零转录，只花 LLM 调用）。
        description: 'check-new=常规；archive-transcripts=只抓字幕存档；reanalyze=用最新提示词重跑历史'
        required: false
        default: 'check-new'
        type: choice
        options:
          - check-new
          - archive-transcripts
          - reanalyze
      count:
        description: 'archive-transcripts / reanalyze 的条数，或逗号分隔的 BV 号'
        required: false
        default: '10'
      whisper:
        # ★ 2026-11-07：`archiveTranscripts(arg, allowWhisper=false)` 默认**无 AI 字幕就跳过**
        #   （作者原意：Actions 上 whisper 慢且不可控，不该做成默认路径）。
        #   但 2026-04~07 那批老视频很可能没有 AI 字幕，需要时才显式打开。
        #   ⚠️ 打开后每条要下载音频 + 跑 faster-whisper（几分钟/条），
        #      每批条数必须调小（建议 ≤5），否则会撞 timeout-minutes:120；
        #      job 被杀后「提交更新」不执行 ⇒ 整批改动全丢。
        description: '仅 archive-transcripts 有效：1=无 AI 字幕时回退 faster-whisper（慢，慎用）'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

# 定时器每30分钟触发一次，而长视频转录可能跑很久：
# 同一时间只保留一个运行，避免两个任务同时处理同一视频导致重复推送
concurrency:
  group: check-bilibili
  cancel-in-progress: false

jobs:
  check-new-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Node 依赖
        run: npm install

      - name: 安装 yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: 安装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: 安装 faster-whisper
        run: python -m pip install faster-whisper

      # 关键：缓存路径必须和 Python 脚本里的一致
      - name: 缓存 Whisper 模型
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ctranslate2
          key: whisper-model-base-${{ runner.os }}
          restore-keys: |
            whisper-model-base-

      - name: LLM 连通性诊断
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ secrets.LLM_FALLBACK_MODELS }}
        run: node scripts/check-llm.js

      - name: 检查新视频并分析
        env:
          # ★ 2026-10-29：必须显式传下去。脚本里 `ONLY_LATEST !== '0'` 为 true 时
          #   只取最新 1 条 ⇒ 主 UP 的 `maxPerRun: 5` 被它短路，永远补不满。
          #   `|| '1'` 兜底：非 workflow_dispatch 触发（若以后加回 cron）时输入为 null。
          ONLY_LATEST: ${{ github.event.inputs.only_latest || '1' }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ secrets.LLM_FALLBACK_MODELS }}
          BILI_UID: ${{ secrets.BILI_UID }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          # 额外解读的UP主（逗号分隔的UID），留空则用脚本内默认值
          EXTRA_UPS: ${{ secrets.EXTRA_UPS }}
          # 额外UP主：视频时长上限（秒）与每次运行最多处理数量
          EXTRA_UP_MAX_DURATION: ${{ secrets.EXTRA_UP_MAX_DURATION }}
          EXTRA_UP_MAX_PER_RUN: ${{ secrets.EXTRA_UP_MAX_PER_RUN }}
          # 可选：额外UP主推送到另一个企微群，不配则用上面的 WECHAT_WEBHOOK
          EXTRA_WECHAT_WEBHOOK: ${{ secrets.EXTRA_WECHAT_WEBHOOK }}
          # 可选：faster-whisper 模型大小（base/small/medium），留空默认 base
          WHISPER_MODEL: ${{ secrets.WHISPER_MODEL }}
        run: |
          MODE="${{ github.event.inputs.run_mode || 'check-new' }}"
          COUNT="${{ github.event.inputs.count || '10' }}"
          WHISPER="${{ github.event.inputs.whisper || '0' }}"
          # count 是自由输入，且要拼进命令行 —— 先做白名单校验，避免注入
          if ! [[ "$COUNT" =~ ^[0-9A-Za-z,]+$ ]]; then
            echo "非法 count: $COUNT（只允许数字、字母、逗号）"; exit 1
          fi
          # ★ whisper 仅在显式选 1 时拼进命令；空变量不加引号会自动消失（不传空参数）
          WHISPER_FLAG=""
          if [ "$WHISPER" = "1" ]; then WHISPER_FLAG="--whisper"; fi
          echo "mode=$MODE count=$COUNT whisper=$WHISPER"
          case "$MODE" in
            archive-transcripts) node scripts/analyze-video.js --archive-transcripts "$COUNT" $WHISPER_FLAG ;;
            reanalyze)           node scripts/analyze-video.js --reanalyze "$COUNT" ;;
            *)                   node scripts/analyze-video.js --check-new ;;
          esac

      - name: 提交更新
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          if ! git diff --staged --quiet; then
            git commit -m "📊 更新视频分析数据 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            # ★★ 2026-11-07：**push 冲突兜底**。
            #   `concurrency` 只串行化 Actions 之间；只要有人在本地 push 过，
            #   checkout 的基线就落后 ⇒ `git push` 被拒 ⇒ **整批分析结果全丢**。
            #   已发生 2 次：`15e4c33`（BV1XC4n6mEpG 白跑一遍）、更早那次丢了
            #   3 个文件。之前只是 `exit 1` 标红，数据不会自己回来。
            #   策略：rebase 后重试 3 次；rebase 冲突则以**本次分析结果**为准
            #   做一次 merge（数据文件用 -X ours 保留本地）。
            pushed=0
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                echo "✅ push 成功（第 $i 次尝试）"
                pushed=1
                break
              fi
              echo "⚠️ push 被拒（第 $i 次），rebase 后重试"
              if ! git pull --rebase --autostash origin main; then
                echo "⚠️ rebase 冲突，改用 merge，数据文件以本次结果为准"
                git rebase --abort || true
                git pull --no-rebase --no-edit -X ours origin main || true
              fi
              sleep 3
            done
            if [ "$pushed" = "0" ]; then
              echo "::error::push 连续 3 次失败，本次分析结果未能提交（仅在 runner 上，会丢失）"
              exit 1
            fi
          else
            echo "没有新数据，跳过提交"
          fi
